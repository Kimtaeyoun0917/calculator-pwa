<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171923"><link rel="manifest" href="manifest.json"><title>간단 계산기</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#101116;color:white;font-family:system-ui,sans-serif}.calculator{width:min(100%,390px);padding:22px;background:#171923;border-radius:24px}#display{width:100%;padding:24px 8px;text-align:right;font-size:44px;overflow:hidden;white-space:nowrap;min-height:105px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{border:0;border-radius:16px;min-height:70px;font-size:26px;background:#303441;color:white;cursor:pointer;touch-action:manipulation}button:active{filter:brightness(1.3)}.op{background:#e7a43d;color:#171923}.utility{background:#555c6c}.zero{grid-column:span 2}</style></head><body><main class="calculator"><div id="display" role="status" aria-live="polite">0</div><div class="keys"><button class="utility" data-action="clear">C</button><button class="utility" data-action="back">⌫</button><button class="utility" data-action="percent">%</button><button class="op" data-op="/">÷</button><button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button class="op" data-op="*">×</button><button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button class="op" data-op="-">−</button><button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button class="op" data-op="+">+</button><button class="zero" data-digit="0">0</button><button data-action="dot">.</button><button class="op" data-action="equals">=</button></div></main><script>let current='0',previous=null,operator=null,reset=false;const display=document.querySelector('#display');function show(){display.textContent=current}function digit(d){if(current==='오류'||reset){current=d;reset=false}else current=current==='0'?d:current+d;show()}function calculate(){if(previous===null||operator===null)return;const a=Number(previous),b=Number(current);let n=operator==='+'?a+b:operator==='-'?a-b:operator==='*'?a*b:b===0?NaN:a/b;current=Number.isFinite(n)?String(Number(n.toPrecision(12))):'오류';previous=null;operator=null;reset=true;show()}function operate(op){if(current==='오류')return;if(operator&&!reset)calculate();previous=current;operator=op;reset=true}function action(a){if(a==='clear'){current='0';previous=null;operator=null;reset=false}else if(a==='back'){if(reset||current==='오류'){current='0';reset=false}else current=current.length>1?current.slice(0,-1):'0'}else if(a==='dot'){if(reset||current==='오류'){current='0';reset=false}if(!current.includes('.'))current+='.'}else if(a==='percent'){if(current!=='오류')current=String(Number(current)/100)}else if(a==='equals'){calculate();return}show()}document.querySelector('.keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.digit!==undefined)digit(b.dataset.digit);else if(b.dataset.op)operate(b.dataset.op);else action(b.dataset.action)});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
